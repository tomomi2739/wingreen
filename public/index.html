<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>WinGreen 月次レポート</title>
<style>
  :root {
    color-scheme: light;
    --plane:          #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6;  /* 売上 */
    --series-2:       #eb6834;  /* 経費 */
    --series-3:       #1baf7a;  /* 営業利益 */
    --critical:       #d03b3b;
    --good:           #0ca30c;
    --warning:        #fab219;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane:          #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --axis:           #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --critical:       #d03b3b;
      --good:           #0ca30c;
      --warning:        #fab219;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }

  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .01em; }
  .sub { color: var(--text-muted); font-size: 13px; }

  /* フィルタは1行にまとめてチャートの上に置く */
  .filters {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 18px 0 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
  }
  .filters label { color: var(--text-secondary); font-size: 13px; }
  select, button {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--surface-1);
         border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 7px; padding: 5px 11px;
                color: var(--text-secondary); font-size: 13px; font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
  .seg button.empty { color: var(--text-muted); opacity: .55; }
  .toggle { display: flex; align-items: center; gap: 7px; margin-left: auto; color: var(--text-secondary); }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .tile .k { color: var(--text-secondary); font-size: 13px; }
  .tile .v { font-size: 27px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; }
  .tile .n { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .neg { color: var(--critical); }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
           padding: 18px 20px 14px; margin-bottom: 18px; }
  .panel h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
  .panel .note { color: var(--text-muted); font-size: 12px; margin: 0 0 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 12.5px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cat  { fill: var(--text-secondary); font-size: 12px; }
  .val  { fill: var(--text-secondary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .bar, .dot { cursor: default; }
  .hit { fill: transparent; cursor: default; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
  th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
  thead th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
  tbody tr:hover { background: color-mix(in srgb, var(--text-primary) 4%, transparent); }
  tfoot td { font-weight: 600; border-top: 1px solid var(--axis); border-bottom: 0; }
  .zero td { color: var(--text-muted); }

  /* 承認状況：件数の構成を1本の帯で示す（区切りはサーフェス色の2px隙間） */
  .statusbar { display: flex; gap: 2px; height: 12px; margin: 4px 0 14px; }
  .statusbar > i { border-radius: 3px; display: block; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; vertical-align: -1px; }
  td.status-cell { text-align: left; }

  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px;
    font-size: 12.5px; line-height: 1.5; box-shadow: 0 6px 20px rgba(0,0,0,.14);
    font-variant-numeric: tabular-nums; z-index: 10; white-space: nowrap;
  }
  #tip b { font-weight: 600; }
  .msg { padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border);
         background: var(--surface-1); color: var(--text-secondary); }
  .msg.err { color: var(--critical); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WinGreen 月次レポート</h1>
    <span class="sub" id="periodRange"></span>
  </header>

  <div class="filters">
    <label for="periodSel">会計期</label>
    <select id="periodSel"></select>
    <div class="seg" id="monthSeg"></div>
    <label class="toggle" for="statusSel">集計対象</label>
    <select id="statusSel">
      <option value="all">全件</option>
      <option value="approved">承認済のみ</option>
      <option value="unapproved">未承認のみ</option>
    </select>
  </div>

  <div id="body"><div class="msg">読み込み中…</div></div>
</div>
<div id="tip" role="tooltip"></div>

<script type="module">
const yen = (n) => '¥' + Math.round(n).toLocaleString('ja-JP');
const el  = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const NS = 'http://www.w3.org/2000/svg';

const state = { data: null, month: 'total', statusFilter: 'all' };

// ステータスごとの表示色。名前（文字列ラベル）が必ず隣にあるので、色だけで意味を運ばせない。
const STATUS_COLOR = {
  '承認':   'var(--good)',
  '確認済': 'var(--series-1)',
  '仮登録': 'var(--warning)',
  '却下':   'var(--critical)',
  '未設定': 'var(--text-muted)',
};
const tip = document.getElementById('tip');

function showTip(e, html) {
  tip.innerHTML = html;
  tip.style.opacity = '1';
  const pad = 14, r = tip.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.style.opacity = '0'; };

/** ホバー可能な図形にツールチップを付ける（当たり判定はマークより大きめに取る） */
function hoverable(node, html) {
  node.addEventListener('mousemove', (e) => showTip(e, html));
  node.addEventListener('mouseleave', hideTip);
  return node;
}
function svgEl(name, attrs = {}) {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
}
/** データ端のみ4px丸め、基線側は角のまま */
function barPath(x, y, w, h, r = 4, dir = 'up') {
  const rr = Math.min(r, w / 2, Math.max(h, 0));
  if (h <= 0.5) return `M${x} ${y} h${w}`;
  if (dir === 'up')
    return `M${x} ${y + h} L${x} ${y + rr} Q${x} ${y} ${x + rr} ${y} L${x + w - rr} ${y} Q${x + w} ${y} ${x + w} ${y + rr} L${x + w} ${y + h} Z`;
  // 横向き（右が データ端）
  return `M${x} ${y} L${x + w - rr} ${y} Q${x + w} ${y} ${x + w} ${y + rr} L${x + w} ${y + h - rr} Q${x + w} ${y + h} ${x + w - rr} ${y + h} L${x} ${y + h} Z`;
}
/** 目盛りの刻み幅を決める（1/2/5×10^n） */
function niceStep(range, target = 4) {
  if (range <= 0) return 1;
  const raw = range / target, mag = 10 ** Math.floor(Math.log10(raw)), norm = raw / mag;
  return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
}

/* ---------- 月次推移：売上・経費の縦棒 ＋ 営業利益の折れ線 ---------- */
function trendChart(series) {
  // 該当する仕訳が1件も無いときは、目盛りだけの空グラフを出さずに理由を書く
  if (series.every((s) => s.journalCount === 0)) {
    return el('<div class="msg">この条件に該当する仕訳がありません</div>');
  }

  const W = 1140, H = 320, L = 74, R = 18, T = 16, B = 34;
  const iw = W - L - R, ih = H - T - B;

  const vals = series.flatMap((s) => [s.net.revenue, s.net.expense, s.operatingProfit]);
  const max = Math.max(1, ...vals), min = Math.min(0, ...vals);
  const step = niceStep(max - min);
  const top = Math.ceil(max / step) * step, bottom = Math.floor(min / step) * step;
  const y = (v) => T + ih - ((v - bottom) / (top - bottom || 1)) * ih;
  // 刻みが1万円未満のときに「万」表記だと目盛りが全部同じ値に潰れるので円表示に切り替える
  const tickLabel = (v) => (step >= 10000 ? (v / 10000).toLocaleString('ja-JP') + '万' : yen(v));

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '月次の売上・経費・営業利益の推移' });

  for (let v = bottom; v <= top + 1e-6; v += step) {
    svg.append(svgEl('line', { class: v === 0 ? 'axis-line' : 'grid-line', x1: L, x2: W - R, y1: y(v), y2: y(v) }));
    const t = svgEl('text', { class: 'tick', x: L - 10, y: y(v) + 4, 'text-anchor': 'end' });
    t.textContent = tickLabel(v);
    svg.append(t);
  }

  const bandW = iw / series.length;
  const GAP = 2;                       // 隣り合う棒の間にサーフェス色の2px隙間
  const barW = Math.min(30, (bandW - 26 - GAP) / 2);

  series.forEach((s, i) => {
    const cx = L + bandW * i + bandW / 2;
    const label = svgEl('text', { class: 'cat', x: cx, y: H - B + 20, 'text-anchor': 'middle' });
    label.textContent = s.month.slice(5) + '月';
    svg.append(label);

    const pairs = [
      { v: s.net.revenue, color: 'var(--series-1)', name: '売上' },
      { v: s.net.expense, color: 'var(--series-2)', name: '経費' },
    ];
    pairs.forEach((p, k) => {
      const x = cx - barW - GAP / 2 + k * (barW + GAP);
      const h = Math.abs(y(p.v) - y(0));
      if (p.v > 0) {
        svg.append(hoverable(
          svgEl('path', { class: 'bar', d: barPath(x, y(p.v), barW, h), fill: p.color }),
          `<b>${s.month}</b><br>${p.name} ${yen(p.v)}`));
      }
    });

    // 当たり判定を月ごとの帯全体に広げ、3系列まとめて読めるようにする
    svg.append(hoverable(
      svgEl('rect', { class: 'hit', x: L + bandW * i, y: T, width: bandW, height: ih }),
      `<b>${s.month}</b><br>売上 ${yen(s.net.revenue)}<br>経費 ${yen(s.net.expense)}<br>営業利益 ${yen(s.operatingProfit)}`));
  });

  // 仕訳がまだ1件もない月（未到来の月）まで線を引くと「利益ゼロ」と誤読されるため、
  // 最後にデータのある月で線を止める。
  let lastIdx = -1;
  series.forEach((s, i) => { if (s.journalCount > 0) lastIdx = i; });

  if (lastIdx >= 0) {
    const pts = series.slice(0, lastIdx + 1).map((s, i) => [L + bandW * i + bandW / 2, y(s.operatingProfit)]);
    if (pts.length > 1) {
      svg.append(svgEl('polyline', {
        points: pts.map((p) => p.join(',')).join(' '),
        fill: 'none', stroke: 'var(--series-3)', 'stroke-width': 2,
        'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }));
    }
    pts.forEach(([px, py], i) => {
      // 重なり回避のサーフェス色リング
      svg.append(svgEl('circle', { cx: px, cy: py, r: 5, fill: 'var(--series-3)', stroke: 'var(--surface-1)', 'stroke-width': 2, class: 'dot' }));
      const profit = series[i].operatingProfit;
      if (profit !== 0) {
        // マイナスでもラベルは点の上に置く（下に出すと軸の月ラベルと衝突する）
        const t = svgEl('text', { class: 'val', x: px, y: py - 11, 'text-anchor': 'middle' });
        t.textContent = step >= 10000 ? Math.round(profit / 10000).toLocaleString('ja-JP') + '万' : yen(profit);
        svg.append(t);
      }
    });
  }

  // データがまだ無い月は薄く「—」を置き、ゼロと区別する
  series.forEach((s, i) => {
    if (i <= lastIdx || s.journalCount > 0) return;
    const t = svgEl('text', { class: 'tick', x: L + bandW * i + bandW / 2, y: y(0) - 8, 'text-anchor': 'middle' });
    t.textContent = '—';
    svg.append(t);
  });

  svg.append(svgEl('line', { class: 'axis-line', x1: L, x2: L, y1: T, y2: T + ih }));
  return svg;
}

/* ---------- 内訳：横棒（単一系列なので凡例なし・値を直接ラベル） ---------- */
function breakdownChart(entries, color, emptyText) {
  if (!entries.length) return el(`<div class="msg">${esc(emptyText)}</div>`);

  const rows = [...entries].sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));
  const LH = 34, W = 540, L = 132, R = 96, T = 6;
  const H = T * 2 + rows.length * LH;
  const iw = W - L - R;
  const max = Math.max(1, ...rows.map(([, v]) => Math.abs(v)));
  const total = rows.reduce((a, [, v]) => a + v, 0);

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
  rows.forEach(([name, v], i) => {
    const yTop = T + i * LH + 7, bh = 20;
    const w = Math.max(1, (Math.abs(v) / max) * iw);

    const cat = svgEl('text', { class: 'cat', x: L - 12, y: yTop + 14, 'text-anchor': 'end' });
    cat.textContent = name;
    svg.append(cat);

    svg.append(svgEl('path', { class: 'bar', d: barPath(L, yTop, w, bh, 4, 'right'), fill: color }));

    const vt = svgEl('text', { class: 'val', x: L + w + 10, y: yTop + 14 });
    vt.textContent = yen(v);
    svg.append(vt);

    const share = total ? Math.round((v / total) * 1000) / 10 : 0;
    svg.append(hoverable(
      svgEl('rect', { class: 'hit', x: 0, y: T + i * LH, width: W, height: LH }),
      `<b>${esc(name)}</b><br>${yen(v)}<br>構成比 ${share}%`));
  });
  return svg;
}

/* ---------- 画面の組み立て ---------- */
function scopeOf(d) {
  if (state.month === 'total') return { ...d.totals, label: `${d.period.label}累計` };
  const s = d.series.find((x) => x.month === state.month);
  return { ...s, label: `${s.month.replace('-', '年')}月` };
}

function render() {
  const d = state.data;
  document.getElementById('periodRange').textContent = `${d.period.label}（${d.period.start} 〜 ${d.period.end}）`;

  const sel = document.getElementById('periodSel');
  sel.innerHTML = d.availablePeriods.map((p) => `<option value="${p.no}">${esc(p.label)}</option>`).join('');
  sel.value = String(d.period.no);

  const seg = document.getElementById('monthSeg');
  seg.innerHTML = '';
  const mk = (key, text, empty) => {
    const b = el(`<button aria-pressed="${state.month === key}" class="${empty ? 'empty' : ''}">${text}</button>`);
    b.onclick = () => { state.month = key; render(); };
    return b;
  };
  seg.append(mk('total', '期累計', false));
  d.series.forEach((s) => seg.append(mk(s.month, s.month.slice(5) + '月', s.journalCount === 0)));

  const sc = scopeOf(d);
  const profitCls = sc.operatingProfit < 0 ? ' neg' : '';

  const body = document.getElementById('body');
  body.innerHTML = '';
  body.append(el(`
    <div class="tiles">
      <div class="tile"><div class="k">売上（税抜）</div><div class="v">${yen(sc.net.revenue)}</div><div class="n">税込 ${yen(sc.gross.revenue)}</div></div>
      <div class="tile"><div class="k">経費（税抜）</div><div class="v">${yen(sc.net.expense)}</div><div class="n">税込 ${yen(sc.gross.expense)}</div></div>
      <div class="tile"><div class="k">営業利益</div><div class="v${profitCls}">${yen(sc.operatingProfit)}</div><div class="n">売上 − 経費</div></div>
      <div class="tile"><div class="k">経常利益</div><div class="v${sc.ordinaryProfit < 0 ? ' neg' : ''}">${yen(sc.ordinaryProfit)}</div><div class="n">仕訳 ${sc.journalCount}件 / ${esc(sc.label)}</div></div>
    </div>`));

  const trend = el(`<div class="panel"><h2>月次推移</h2><p class="note">税抜ベース。棒が売上と経費、折れ線が営業利益。仕訳がまだ無い月は「—」。</p>
    <div class="legend">
      <span><i class="swatch" style="background:var(--series-1)"></i>売上</span>
      <span><i class="swatch" style="background:var(--series-2)"></i>経費</span>
      <span><i class="swatch" style="background:var(--series-3)"></i>営業利益</span>
    </div></div>`);
  trend.append(trendChart(d.series));
  body.append(trend);

  const cols = el('<div class="cols"></div>');
  const rev = el(`<div class="panel"><h2>売上内訳</h2><p class="note">貸方の補助科目別・${esc(sc.label)}</p></div>`);
  rev.append(breakdownChart(Object.entries(sc.revenueBreakdown), 'var(--series-1)', 'この期間の売上仕訳はまだありません'));
  const exp = el(`<div class="panel"><h2>経費内訳</h2><p class="note">借方の勘定科目別・${esc(sc.label)}</p></div>`);
  exp.append(breakdownChart(Object.entries(sc.expenseBreakdown), 'var(--series-2)', 'この期間の経費仕訳はまだありません'));
  cols.append(rev, exp);
  body.append(cols);

  // 承認状況（承認済・未承認の内訳が一目で分かるようにする）
  const st = sc.byStatus;
  const stRows = d.statuses.filter((k) => st[k].count > 0);
  const stTotal = d.statuses.reduce((a, k) => a + st[k].count, 0);
  const approvedCount = st['承認'].count;
  const pendingCount = stTotal - approvedCount;

  const statusPanel = el(`
    <div class="panel"><h2>承認状況</h2>
      <p class="note">${esc(sc.label)}・仕訳 ${stTotal}件のうち 承認済 ${approvedCount}件 / 未承認 ${pendingCount}件</p>
      <div class="statusbar">${
        stRows.map((k) => `<i style="background:${STATUS_COLOR[k]};flex:${st[k].count}"></i>`).join('')
        || '<i style="background:var(--grid);flex:1"></i>'
      }</div>
      <table>
        <thead><tr><th>ステータス</th><th>件数</th><th>売上</th><th>経費</th></tr></thead>
        <tbody>${
          (stRows.length ? stRows : d.statuses).map((k) => `
            <tr class="${st[k].count === 0 ? 'zero' : ''}">
              <td class="status-cell"><i class="dot" style="background:${STATUS_COLOR[k]}"></i>${esc(k)}</td>
              <td>${st[k].count}</td>
              <td>${st[k].count ? yen(st[k].revenue) : '—'}</td>
              <td>${st[k].count ? yen(st[k].expense) : '—'}</td>
            </tr>`).join('')
        }</tbody>
      </table>
    </div>`);
  body.append(statusPanel);

  // 一覧表（グラフと同じ数字を必ず文字でも読めるようにする）
  const rows = d.series.map((s) => {
    // 仕訳が0件の月は「¥0」ではなく「—」を出し、未入力・未到来であることを示す
    if (s.journalCount === 0) {
      return `<tr class="zero"><td>${s.month}</td><td>—</td><td>—</td><td>—</td><td>—</td><td>0</td><td>—</td></tr>`;
    }
    const pending = s.journalCount - s.byStatus['承認'].count;
    return `
    <tr>
      <td>${s.month}</td><td>${yen(s.net.revenue)}</td><td>${yen(s.net.expense)}</td>
      <td class="${s.operatingProfit < 0 ? 'neg' : ''}">${yen(s.operatingProfit)}</td>
      <td class="${s.ordinaryProfit < 0 ? 'neg' : ''}">${yen(s.ordinaryProfit)}</td>
      <td>${s.journalCount}</td>
      <td>${pending > 0 ? pending : '—'}</td>
    </tr>`;
  }).join('');
  body.append(el(`
    <div class="panel"><h2>月次一覧</h2><p class="note">税抜ベース</p>
      <table>
        <thead><tr><th>年月</th><th>売上</th><th>経費</th><th>営業利益</th><th>経常利益</th><th>仕訳件数</th><th>うち未承認</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>${esc(d.period.label)}累計</td><td>${yen(d.totals.net.revenue)}</td><td>${yen(d.totals.net.expense)}</td>
          <td class="${d.totals.operatingProfit < 0 ? 'neg' : ''}">${yen(d.totals.operatingProfit)}</td>
          <td class="${d.totals.ordinaryProfit < 0 ? 'neg' : ''}">${yen(d.totals.ordinaryProfit)}</td>
          <td>${d.totals.journalCount}</td>
          <td>${d.totals.journalCount - d.totals.byStatus['承認'].count || '—'}</td>
        </tr></tfoot>
      </table>
    </div>`));

  const sk = d.skipped, dropped = Object.values(sk).reduce((a, b) => a + b, 0);
  if (dropped > 0) {
    body.append(el(`<div class="msg">集計から除外した仕訳 ${dropped}件 —
      日付なし ${sk.noDate} / 期間外 ${sk.outOfPeriod} / 集計対象の絞り込み ${sk.byStatusFilter} / 損益科目なし ${sk.noAccount}</div>`));
  }
}

async function load() {
  const body = document.getElementById('body');
  body.innerHTML = '<div class="msg">読み込み中…</div>';
  const period = document.getElementById('periodSel').value;
  const qs = new URLSearchParams();
  if (period) qs.set('period', period);
  if (state.statusFilter !== 'all') qs.set('status', state.statusFilter);
  try {
    const res = await fetch('/api/monthly-report?' + qs);
    const json = await res.json();
    if (!res.ok) throw new Error(json.error ?? `HTTP ${res.status}`);
    state.data = json;
    if (state.month !== 'total' && !json.months.includes(state.month)) state.month = 'total';
    render();
  } catch (err) {
    body.innerHTML = `<div class="msg err">読み込みに失敗しました: ${esc(err.message)}</div>`;
  }
}

document.getElementById('periodSel').onchange = load;
document.getElementById('statusSel').onchange = (e) => { state.statusFilter = e.target.value; load(); };
load();
</script>
</body>
</html>
