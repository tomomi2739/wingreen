<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>WinGreen 会計</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" src="/assets/logo.png" alt="">
    <h1>WinGreen 会計</h1>
    <span class="sub" id="periodRange"></span>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-report"   aria-selected="true"  aria-controls="view">月次レポート</button>
    <button role="tab" id="tab-journal"  aria-selected="false" aria-controls="view">仕訳明細</button>
    <button role="tab" id="tab-invoices" aria-selected="false" aria-controls="view">請求書</button>
  </nav>

  <div id="view" role="tabpanel"><div class="msg">読み込み中…</div></div>
</div>

<script type="module">
import * as report from './report.js';
import * as journal from './journal.js';
import * as invoices from './invoices.js';

const view = document.getElementById('view');
const tabs = {
  report:   { btn: document.getElementById('tab-report'),   mod: report },
  journal:  { btn: document.getElementById('tab-journal'),  mod: journal },
  invoices: { btn: document.getElementById('tab-invoices'), mod: invoices },
};

function show(name, push = true) {
  for (const [key, t] of Object.entries(tabs)) {
    t.btn.setAttribute('aria-selected', String(key === name));
  }
  if (push && location.hash !== `#${name}`) location.hash = name;
  tabs[name].mod.load(view);
}

for (const [name, t] of Object.entries(tabs)) t.btn.onclick = () => show(name);

// 期の表示はレポートAPIから取れるので、ヘッダーにだけ出しておく
fetch('/api/monthly-report').then((r) => r.json()).then((d) => {
  if (d.period) {
    document.getElementById('periodRange').textContent = `${d.period.label}（${d.period.start} 〜 ${d.period.end}）`;
  }
}).catch(() => {});

addEventListener('hashchange', () => {
  const name = location.hash.slice(1);
  if (tabs[name]) show(name, false);
});

show(tabs[location.hash.slice(1)] ? location.hash.slice(1) : 'report', false);
</script>
</body>
</html>
